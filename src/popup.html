<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Local Input Translator</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <span class="brandmark" aria-hidden="true">文</span>
      <div><h1>Local Input Translator</h1><p>PLaMo 3 Translate 0.8B / ローカル実行</p></div>
    </header>
    <label for="language">翻訳先言語</label>
    <select id="language"></select>
    <label for="input">日本語の文章</label>
    <textarea id="input" placeholder="翻訳する文章を入力…" rows="5" maxlength="3000"></textarea>
    <div class="row"><span id="count">0 / 3000</span><span>53言語対応</span></div>
    <button id="translate" class="primary">翻訳する</button>
    <div class="status" id="status" role="status" aria-live="polite">モデルは初回使用時に約570MBダウンロードされます。</div>
    <label for="output">翻訳結果</label>
    <textarea id="output" rows="4" readonly placeholder="翻訳結果がここに表示されます"></textarea>
    <button id="copy" class="secondary" disabled>結果をコピー</button>
    <hr>
    <button id="field" class="secondary">現在のページの入力欄を翻訳・置換</button>
    <p class="hint">入力欄にカーソルを置き、<kbd>⌘</kbd>+<kbd>⇧</kbd>+<kbd>Y</kbd> でも実行できます（Macの場合）。</p>
    <p class="hint">翻訳内容はクラウドに送信されません。モデルの取得時のみHugging Faceへ通信します。</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
